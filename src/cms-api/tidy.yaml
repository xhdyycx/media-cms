# 洗版只有在整理过程中发现重复资源才会执行
# 此配置文件可以设置多个洗版策略，每个洗版策略里可以有多个优先级，上面的优先级最高
# 兜底策略不要删，在上面增加你的自定义就行
# 示例：https://wiki.cmscc.cc/docs/auto-organize#洗版策略

# 第一级为策略组别名，随便写。（当 scope: group 时一个策略组代表一个你需要保留的版本）
# 兜底策略留着不要删
电影兜底策略:
  # 洗版模式：
  #   coexist: 共存（不洗版，全都要）
  #   skip: 跳过（就是只要有一个，就不再保存了）
  #   replace:（就是根据优先级进行洗版）
  #   max_size:（就是在优先级相同时保留最大的）
  #   min_size:（就是在优先级相同时保留最小的）
  #   latest:（就是在优先级相同时保留最新的，比较的是网盘里的更新时间）
  mode: coexist
  # 有效范围：
  #   all: 所有策略都有效
  #   group: 只对同一组内的资源进行洗版（当你需要多版本洗版时用它）
  scope: all
  # 匹配媒体类型，movie/tv，去掉这个字段即匹配所有
  media_type: movie

# 兜底策略留着不要删
剧集兜底策略:
  media_type: tv
  mode: skip