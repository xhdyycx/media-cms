# 配置电影的分类策略
movie:
  # 分类名仅为标识 不起任何作用
  动画电影:
    cid: 1000000000000000001
    cid123: 123456
    # 匹配 genre_ids 内容类型，16是动漫
    genre_ids: '16'
  华语电影:
    cid: 1000000000000000002
    cid123: 123456
    # 匹配语种
    original_language: 'zh,cn,bo,za'
  # 未匹配以上条件时，返回最后一个
  外语电影:
    cid: 1000000000000000003
    cid123: 123456

# 配置电视剧的分类策略
tv:
  儿童:
    cid: 1000000000000000004
    cid123: 123456
    # 10762是儿童
    genre_ids: '10762'
  国漫:
    cid: 1000000000000000005
    cid123: 123456
    genre_ids: '16'
    # 匹配 origin_country 国家，CN是中国大陆，TW是中国台湾，HK是中国香港
    origin_country: 'CN,TW,HK'
  日番:
    cid: 1000000000000000006
    cid123: 123456
    genre_ids: '16'
    # JP是日本
    origin_country: 'JP'
  纪录片:
    cid: 1000000000000000007
    cid123: 123456
    # 99是纪录片
    genre_ids: '99'
  综艺:
    cid: 1000000000000000008
    cid123: 123456
    # 10764 10767都是综艺
    genre_ids: '10764,10767'
  国产剧:
    cid: 1000000000000000009
    cid123: 123456
    origin_country: 'CN,TW,HK'
  欧美剧:
    cid: 1000000000000000010
    cid123: 123456
    # 主要欧美国家列表
    origin_country: 'US,FR,GB,DE,ES,IT,NL,PT,RU,UK'
  日韩剧:
    cid: 1000000000000000011
    cid123: 123456
    # 主要亚洲国家列表
    origin_country: 'JP,KP,KR,TH,IN,SG'
  其它:
    cid: 1000000000000000012
    cid123: 123456